[package]
name = "fsrs"
version = "6.6.2"
authors = ["Open Spaced Repetition"]
categories = ["algorithms", "science"]
edition = "2024"
homepage = "https://github.com/open-spaced-repetition"
keywords = ["spaced-repetition", "algorithm", "fsrs", "machine-learning"]
license = "BSD-3-Clause"
readme = "README.md"
repository = "https://github.com/open-spaced-repetition/fsrs-rs"
description = "FSRS for Rust, including Optimizer and Scheduler"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bytemuck = "1"
itertools = "0.15.0"
log = "0.4"
ndarray = "0.17.2"
priority-queue = "=2.7.0"
rand = "0.10.2"
rand_distr = "0.5.1"
rayon = "1.12.0"
roots = "0.0.8"
serde = { version = "1.0.228", features = ["derive"] }
snafu = "0.9.1"
strum = { version = "0.28.0", features = ["derive"] }
wide = "0.7"

[dev-dependencies]
chrono = { version = "0.4.44", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10.4"
criterion = { version = "0.8.2" }
csv = "1.4.0"
fern = "0.7.1"
rusqlite = { version = "0.34.0", features = ["bundled-windows"] }

[[bench]]
name = "benchmark"
harness = false

[[bench]]
name = "simulation"
harness = false

[[bench]]
name = "parameters"
harness = false

[[bench]]
name = "fsrs7_penalty"
harness = false

[[bench]]
name = "cost_adr"
harness = false

[[example]]
name = "schedule"
path = "examples/schedule.rs"

[[example]]
name = "migrate"
path = "examples/migrate.rs"

[[example]]
name = "optimize"
path = "examples/optimize.rs"

[[example]]
name = "cost_adr"
path = "examples/cost_adr.rs"

[[example]]
name = "classifier"
path = "examples/classifier.rs"
